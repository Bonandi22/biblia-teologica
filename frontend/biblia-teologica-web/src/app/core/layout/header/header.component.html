<header class="header">
  <div class="header__inner">
    <nav id="nav-principal" class="header__nav" [class.header__nav--aberto]="menuAberto()">
      <ul class="header__lista">
        @for (item of itens(); track item.rota) {
          <li>
            <a [routerLink]="item.rota" routerLinkActive="ativo" (click)="fecharMenu()">{{
              item.rotulo
            }}</a>
          </li>
        }
      </ul>

      <div class="header__acoes header__acoes--menu">
        <ng-container *ngTemplateOutlet="acoes; context: { modo: 'lista' }" />
      </div>
    </nav>

    <p class="header__lugar">{{ lugar() }}</p>

    <div class="header__direita">
      <a class="header__marca" routerLink="/" (click)="fecharMenu()">Bíblia Teológica</a>
      <div class="header__acoes header__acoes--barra">
        <ng-container *ngTemplateOutlet="acoes; context: { modo: 'menu' }" />
      </div>
    </div>

    <button
      class="header__toggle"
      type="button"
      [attr.aria-expanded]="menuAberto()"
      [attr.aria-label]="menuAberto() ? 'Fechar menu' : 'Abrir menu'"
      aria-controls="nav-principal"
      (click)="alternarMenu()"
    >
      Menu
    </button>
  </div>
</header>

<ng-template #acoes let-modo="modo">
  @if (autenticado()) {
    <bt-menu-conta [modo]="modo" />
  } @else {
    <a routerLink="/entrar" routerLinkActive="ativo" (click)="fecharMenu()">Entrar</a>
  }
</ng-template>

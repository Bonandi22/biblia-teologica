<div class="folha">
  <h1>Minha conta</h1>

  @if (perfil(); as p) {
    <dl class="dados">
      <div><dt>Email</dt><dd>{{ p.email }}</dd></div>
      <div><dt>Perfis</dt><dd>{{ p.roles.join(', ') || 'Nenhum' }}</dd></div>
    </dl>

    <form [formGroup]="formNome" (ngSubmit)="guardarNome()" novalidate>
      <bt-campo label="Nome a exibir" [erro]="erroDe(formNome.controls.nomeExibicao)">
        <input btInput formControlName="nomeExibicao" autocomplete="name" />
      </bt-campo>
      <bt-botao type="submit">Salvar nome</bt-botao>
      @if (msgNome(); as m) {
        <p class="msg" role="status">{{ m }}</p>
      }
    </form>

    <form class="secao" [formGroup]="formEmail" (ngSubmit)="guardarEmail()" novalidate>
      <h2>Trocar email</h2>
      <bt-campo label="Novo email" [erro]="erroDe(formEmail.controls.novoEmail)">
        <input btInput type="email" formControlName="novoEmail" autocomplete="email" />
      </bt-campo>
      <bt-campo-senha
        label="Senha atual"
        formControlName="senha"
        autocomplete="current-password"
        [erro]="erroDe(formEmail.controls.senha)"
      />
      <bt-botao type="submit" variante="fantasma">Trocar email</bt-botao>
      @if (msgEmail(); as m) {
        <p class="msg" role="status">{{ m }}</p>
      }
    </form>

    <div class="acoes">
      <a routerLink="trocar-senha" class="ligacao">Trocar senha</a>
      <bt-botao variante="texto" (click)="sair()">Sair</bt-botao>
    </div>
  } @else {
    <p aria-busy="true">Carregando…</p>
  }
</div>

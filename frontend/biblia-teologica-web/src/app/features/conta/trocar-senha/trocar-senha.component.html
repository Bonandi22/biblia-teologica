<mat-card class="cartao">
  <h1>Trocar senha</h1>

  @if (erro(); as e) {
    <p class="erro" role="alert">{{ e }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submeter()">
    <mat-form-field appearance="outline">
      <mat-label>Senha atual</mat-label>
      <input matInput type="password" formControlName="senhaAtual" autocomplete="current-password" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Nova senha</mat-label>
      <input matInput type="password" formControlName="novaSenha" autocomplete="new-password" />
      <mat-hint>Mínimo 8 caracteres.</mat-hint>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Confirmar nova senha</mat-label>
      <input matInput type="password" formControlName="confirmar" autocomplete="new-password" />
    </mat-form-field>
    @if (form.hasError('diferentes') && form.get('confirmar')?.touched) {
      <p class="erro" role="alert">As senhas não coincidem.</p>
    }
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">
      Trocar senha
    </button>
  </form>
</mat-card>

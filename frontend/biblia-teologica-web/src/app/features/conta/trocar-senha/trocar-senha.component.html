<div class="folha">
  <h1>Trocar senha</h1>

  @if (erro(); as e) {
    <bt-alerta tipo="erro">{{ e }}</bt-alerta>
  }

  <form [formGroup]="form" (ngSubmit)="submeter()" novalidate>
    <bt-campo-senha
      label="Senha atual"
      formControlName="senhaAtual"
      autocomplete="current-password"
      [erro]="erroDe(form.controls.senhaAtual)"
    />
    <bt-campo-senha
      label="Nova senha"
      hint="Pelo menos 8 caracteres, com maiúscula, minúscula e número."
      formControlName="novaSenha"
      autocomplete="new-password"
      [erro]="erroDe(form.controls.novaSenha)"
    />
    <bt-campo-senha
      label="Confirmar nova senha"
      formControlName="confirmar"
      autocomplete="new-password"
      [erro]="erroConfirmar()"
    />
    <bt-botao type="submit" [carregando]="aEnviar()">Trocar senha</bt-botao>
  </form>
</div>

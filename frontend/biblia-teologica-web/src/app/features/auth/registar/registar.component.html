<mat-card class="cartao">
  <h1>Criar conta</h1>

  @if (erro(); as e) {
    <p class="erro" role="alert">{{ e }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submeter()">
    <mat-form-field appearance="outline">
      <mat-label>Nome a exibir</mat-label>
      <input matInput formControlName="nomeExibicao" autocomplete="name" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="username" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Senha</mat-label>
      <input
        matInput
        type="password"
        formControlName="senha"
        autocomplete="new-password"
      />
      <mat-hint>Mínimo 8 caracteres.</mat-hint>
    </mat-form-field>
    <button mat-flat-button color="primary" type="submit" [disabled]="aEnviar()">Criar conta</button>
  </form>

  <a routerLink="/entrar" class="ligacao">Já tenho conta</a>
</mat-card>

<div class="folha">
  <h1>Entrar</h1>

  @if (erro(); as e) {
    <bt-alerta tipo="erro">{{ e }}</bt-alerta>
  }

  @if (fase() === 'credenciais') {
    <form [formGroup]="formCredenciais" (ngSubmit)="submeterCredenciais()" novalidate>
      <bt-campo label="E-mail" [erro]="erroDe(formCredenciais.controls.email)">
        <input btInput type="email" formControlName="email" autocomplete="username" />
      </bt-campo>
      <bt-campo-senha
        label="Senha"
        formControlName="senha"
        autocomplete="current-password"
        [erro]="erroDe(formCredenciais.controls.senha)"
      />
      <bt-botao type="submit" [carregando]="aEnviar()">Continuar</bt-botao>
    </form>
  } @else {
    <p class="aviso">Enviamos um código para o seu e-mail.</p>
    <form [formGroup]="formCodigo" (ngSubmit)="submeterCodigo()" novalidate>
      <bt-campo label="Código" [erro]="erroDe(formCodigo.controls.codigo)">
        <input btInput inputmode="numeric" formControlName="codigo" autocomplete="one-time-code" />
      </bt-campo>
      <bt-botao type="submit" [carregando]="aEnviar()">Entrar</bt-botao>
    </form>
  }

  <a routerLink="/registar" class="ligacao">Criar conta</a>
</div>

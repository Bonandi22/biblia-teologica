<div class="folha">
  <h1>Entrar</h1>

  @if (fase() === 'credenciais') {
    @if (erro(); as e) {
      <bt-alerta tipo="erro">{{ e }}</bt-alerta>
    }
    <p class="lead">Use o e-mail e a senha da sua conta. Enviaremos um código para confirmar que é você.</p>
    <form [formGroup]="formCredenciais" (ngSubmit)="submeterCredenciais()" novalidate>
      <bt-campo label="E-mail" [erro]="erroDe(formCredenciais.controls.email)">
        <input btInput type="email" formControlName="email" autocomplete="username" />
      </bt-campo>
      <bt-campo-senha
        label="Senha"
        formControlName="senha"
        autocomplete="current-password"
        [erro]="erroDe(formCredenciais.controls.senha)"
      />
      <div class="linha">
        <bt-botao type="submit" [carregando]="aEnviar()">Continuar</bt-botao>
        <a routerLink="/esqueci-senha" class="ligacao">Esqueci minha senha</a>
      </div>
    </form>
    <p class="abaixo">
      Ainda não tem conta?
      <a routerLink="/registar" [queryParams]="retorno ? { retorno } : null" class="ligacao">Criar conta</a>
    </p>
  } @else {
    <bt-verificar-codigo
      [tokenDesafio]="tokenDesafio()"
      [aEnviar]="aEnviar()"
      [erro]="erro()"
      (enviar)="submeterCodigo($event)"
      (voltar)="voltar()"
      (vencido)="desafioVenceu()"
    />
  }
</div>

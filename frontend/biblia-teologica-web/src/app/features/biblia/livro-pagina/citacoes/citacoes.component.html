@for (c of citacoes(); track $index) {
  <bt-linha-estudo
    class="citacao"
    titulo="Citado em"
    [referencias]="c.citadoEm"
    [notas]="c.notas"
    [prefixo]="'cit-' + $index"
  >
    <article>
      <h3 class="citacao__trecho"><bt-referencia [texto]="c.trecho" /></h3>
      @if (c.comentario; as comentario) {
        <p class="citacao__comentario">
          <bt-texto-notas [texto]="comentario" [prefixo]="'cit-' + $index" />
        </p>
      }
    </article>
  </bt-linha-estudo>
}

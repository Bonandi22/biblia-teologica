<div class="lista">
  <header class="lista__topo">
    <h1>Livros</h1>
    <input
      class="lista__busca"
      type="search"
      placeholder="Buscar livro"
      aria-label="Buscar livro"
      autocomplete="off"
      [value]="busca()"
      (input)="busca.set($any($event.target).value)"
    />
  </header>
  <bt-indice-canon [filtro]="busca()" />
</div>

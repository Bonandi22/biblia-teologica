<p class="lead">Enviamos um código para o seu e-mail.</p>
<p class="nota">O código vale por 5 minutos. Se ele não chegar em alguns minutos, tente de novo.</p>

@if (erro(); as e) {
  <bt-alerta tipo="erro">{{ e }}</bt-alerta>
}
@if (erroReenvio(); as e) {
  <bt-alerta tipo="erro">{{ e }}</bt-alerta>
}
@if (aviso(); as a) {
  <bt-alerta tipo="sucesso">{{ a }}</bt-alerta>
}

<form [formGroup]="form" (ngSubmit)="submeter()" novalidate>
  <bt-campo label="Código" [erro]="erroDoCampo()">
    <input btInput inputmode="numeric" autocomplete="one-time-code" formControlName="codigo" />
  </bt-campo>
  <bt-botao type="submit" [carregando]="aEnviar()">Entrar</bt-botao>
</form>

<div class="acoes">
  <span class="reenviar">
    <bt-botao variante="texto" [disabled]="reenviando()" (click)="reenviar()">Reenviar código</bt-botao>
  </span>
  <span class="voltar">
    <bt-botao variante="texto" (click)="voltar.emit()">Voltar</bt-botao>
  </span>
</div>

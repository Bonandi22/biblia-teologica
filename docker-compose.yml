services:
  api:
    build:
      context: .
      dockerfile: src/BibliaTeologica.Api/Dockerfile
    environment:
      ConnectionStrings__Default: "Data Source=/data/biblia.db"
      Cors__AllowedOrigins__0: "http://localhost:4300"
      Jwt__SigningKey: "${BT_JWT_KEY:?defina BT_JWT_KEY no .env}"
      AdminSeed__0__Email: "${BT_ADMIN_EMAIL:?defina BT_ADMIN_EMAIL no .env}"
      AdminSeed__0__SenhaInicial: "${BT_ADMIN_SENHA:?defina BT_ADMIN_SENHA no .env}"
      Email__Sink: "Dev"
    volumes:
      - biblia-data:/data
    ports:
      - "5080:8080"

  web:
    build:
      context: ./frontend/biblia-teologica-web
    ports:
      - "4300:80"
    depends_on:
      - api

volumes:
  biblia-data:

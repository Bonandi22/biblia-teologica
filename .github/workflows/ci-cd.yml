name: CI/CD

on:
  push:
    branches: [main]
  # Sem filtro de branch: PRs empilhados também passam pelo CI.
  pull_request:

jobs:
  # ── Build & Test (backend) ─────────────────────────────────────────────────
  backend:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore BibliaTeologica.sln
      - run: dotnet build BibliaTeologica.sln --no-restore -c Release
      - run: dotnet test BibliaTeologica.sln --no-build -c Release --logger "console;verbosity=minimal"

  # ── Frontend Build & Test ──────────────────────────────────────────────────
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/biblia-teologica-web
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/biblia-teologica-web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
      - run: npm test

  # ── Docker Build & Push (main only) ───────────────────────────────────────
  docker:
    name: Docker Push
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./src/BibliaTeologica.Api/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/biblia-teologica-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web
        uses: docker/build-push-action@v7
        with:
          context: ./frontend/biblia-teologica-web
          push: true
          tags: ghcr.io/${{ env.OWNER }}/biblia-teologica-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

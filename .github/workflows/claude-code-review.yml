name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Revê este PR em português. Foca-te em:

            1. Aderência ao CLAUDE.md — Clean Architecture (regra de negócio no
               Domain/Application), DTOs como contrato, DateTime.UtcNow, async
               ponta a ponta com CancellationToken, AsNoTracking em leitura,
               nunca engolir Exception.
            2. Regras de ouro — endpoints de escrita sem [Authorize], _mapper.Map
               em Update sem ignorar auditoria, entidade/campos sensíveis na
               resposta, AllowAnyOrigin, stack trace em Production, upload sem
               validação, segredos versionados, endpoint/service sem teste.
            3. Correção — bugs, edge cases, invariantes de domínio.
            4. Frontend — sem innerHTML de dado bruto, sem bypassSecurityTrust,
               takeUntilDestroyed em subscrições novas.
            5. Testes — cobertura do caminho feliz + rejeição.

            Usa comentários inline para problemas específicos e um comentário
            de topo para observações gerais.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

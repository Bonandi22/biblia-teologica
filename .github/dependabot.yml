version: 2

updates:
  # ── Backend .NET (NuGet, Central Package Management na raiz) ───────────────
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Um único PR/semana com todos os minor+patch. Majors ficam individuais.
      backend-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ── Frontend Angular (npm) ────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend/biblia-teologica-web
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Lisbon
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ── Imagens Docker (API e web) ───────────────────────────────────────────
  - package-ecosystem: docker
    directories:
      - /src/BibliaTeologica.Api
      - /frontend/biblia-teologica-web
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Lisbon
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  # ── GitHub Actions ───────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Lisbon
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"
